id: table.random_objects
name: Random Objects table
dice: d66
source: gameRules/tables/2_1_random_object_tables.md
entries:
  - roll: 11
    text: >-
      Rope. May be used to climb down a height or to tie up a prisoner.
  - roll: 12
    text: >-
      Religious symbol. A symbol of any religion of your choice may be
      required for certain rituals or used to focus your will and “turn”
      (repel) vampires if you have the Faith Skill. You may pick up a
      religious symbol every time you visit a place of worship. Negligible
      weight.
  - roll: 13
    text: >-
      First Aid Kit. Contains d6+2 first aid points. Each point may be used to
      heal a single Life point after each encounter in which you lost 1 or
      more Life. If you did not lose any Life, you may not use first aid
      points. If you have the Medic Skill, you may use up to 3 first aid
      points per encounter, or 4 if you have Medic Skill (Expert).
  - roll: 14
    text: Axe. See weapon summary table for rules.
    refs: [weapon.axe]
  - roll: 15
    text: >-
      d6 Garlic heads. You may sacrifice 1 head to avoid an encounter with a
      vampire on a roll against the vampire's L. If you are surprised by the
      vampire, you may NOT use garlic. Negligible weight.
  - roll: 16
    text: >-
      Salt (6 doses). 1 dose be sacrificed to avoid an attack when you are
      escaping an encounter with a demon. May be thrown at monsters that are
      vulnerable to salt to inflict 2 Damage. When you find Food points, you
      may decide that 1 such Food point is 1 dose of salt. Negligible weight.
  - roll: 21
    text: Baseball bat. See weapons table.
    refs: [weapon.baseball_bat_or_hammer]
  - roll: 22
    text: >-
      Lighter. May be used to light a candle, a torch or a molotov cocktail.
      May also be useful in some rituals requiring fire. Negligible weight.
  - roll: 23
    text: >-
      Bundle of d6 wooden stakes. May be used to slay vampires stopping their
      regeneration power. You need a hammer to use a stake effectively.
  - roll: 24
    text: >-
      Hammer. Used to nail down doors and windows and to drive stakes through
      the hearts of vampires. It may also be used as a weapon.
    refs: [weapon.baseball_bat_or_hammer]
  - roll: 25
    text: >-
      Exorcism ritual (book). Allows you to learn the Exorcism Arcane Skill if
      you have the Faith Skill.
  - roll: 26
    text: >-
      Backpack. Increases by 5 your limit of carried items and Food points.
  - roll: 31
    text: >-
      Flashlight. This is a source of light; it may be used as a ranged weapon
      to attack shadow creatures at +2, Damage 1. After each encounter with
      shadow creatures, there is a 1 in 6 chance of the batteries running out.
    refs: [weapon.flashlight]
  - roll: 32
    text: >-
      Silver necklace. Negligible weight. You may turn it into d3 silver
      bullets if you find smelting equipment.
  - roll: 33
    text: >-
      d6 Food points. You may decide that 1 Food is 1 dose of salt instead.
  - roll: 34
    text: >-
      d3 vials of holy water. This may be sacrificed and thrown against any
      demon or non-zombie Undead, automatically hitting for 2 points of
      Damage.
  - roll: 35
    text: >-
      Spray Can. If you have a lighter, you may use this as an improvised
      flamethrower, automatically inflicting 2 points of Damage against any
      target or 3 points of Damage against any target that is vulnerable to
      fire.
  - roll: 36
    text: Shovel. Useful to dig graves or as a two-handed melee weapon.
    refs: [weapon.scythe_or_shovel]
  - roll: 41
    text: Flute. May be used to play music and perform certain rituals.
  - roll: 42
    text: >-
      Rubber Mask. Roll a die, on a 1-3 it is the face of a politician, on a
      4-6 a classic Halloween monster. They say certain monsters may not
      attack you if they cannot see your face. Negligible weight.
  - roll: 43
    text: Train ticket. Negligible weight.
  - roll: 44
    text: >-
      d6+3 candles. Used for many rituals. You need a lighter or other source
      of fire to light them.
  - roll: 45
    text: >-
      Random book. Roll 2d6 on the Book Table. If you begin the game with a
      book, you already read it but you still cannot begin the game with any
      Arcane Skills (but you may learn any Arcane Skill taught by the book as
      soon as you have enough XP to pay its cost).
    refs: [table.random_book]
  - roll: 46
    text: >-
      d6 shotgun shells. Ammo for a shotgun. You may turn one into a silver
      shell if you load it with a silver ring or silver necklace.
  - roll: 51
    text: Rat poison. Useful if you venture in the sewers.
  - roll: 52
    text: >-
      Leather jacket with a flaming skull motif printed on the back.
      Negligible weight if worn, counts as 1 carried object otherwise.
  - roll: 53
    text: Insecticide. Useful against bug-like creatures.
  - roll: 54
    text: >-
      Samurai sword. Roll d6, on a 1 or 2 it is an authentic antique weapon,
      on a 3-6 is a cheap replica. See weapon summary table.
    refs: [weapon.samurai_sword_authentic, weapon.samurai_sword_cheap_replica]
  - roll: 55
    text: >-
      d6 cans of dog food. May be used as 1 Food point each (yuck!) or
      sacrificed to avoid an encounter with any canine creature (not
      werewolves).
  - roll: 56
    text: Creepy looking doll.
  - roll: 61
    text: >-
      Computer print-out. Somebody printed out a whole book. Roll on the
      Random Book table, rerolling any result of 2 or 12.
    refs: [table.random_book]
  - roll: 62
    text: >-
      Journal. Keeping a journal will help you focus and learn from your
      experience. If you have a journal, every time you accumulate 5 XP, you
      gain 1 extra XP.
  - roll: 63
    text: >-
      Crescent shaped silver amulet. May be used to create 2 silver bullets if
      you have smelting equipment. If worn, it gives you +1 to Escape rolls
      against werewolves.
  - roll: 64
    text: >-
      Box of nails. May be useful to nail shut a coffin and also for some
      spells.
  - roll: 65
    text: Black mirror. Useful for some rituals.
  - roll: 66
    text: >-
      Smelting equipment. Counts as 2 carried items. You may create silver
      bullets if you have any silver item.
