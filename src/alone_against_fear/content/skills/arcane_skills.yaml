name: Arcane Skills
source: gameRules/1_3_arcane_skills.md
arcane_skills:
  - id: arcane_skill.alien_fighter
    name: Alien Fighter
    xp: 3
    text: >-
      You may learn this Arcane Skill by reading the book They Are Among Us.
      You gain +1 to Attack and Defense rolls against Aliens.
    expert: the bonus becomes +2.
  - id: arcane_skill.curse
    name: Curse
    xp: 2
    components: lighter or box of matches.
    sacrifice: 1 candle, 1 dose of bone powder.
    text: |-
      You may learn this ritual from one of the following books:

      - The Necronomicon
      - The Diabolical Deal

      You can perform this ritual to prepare a curse that you will “cast” in combat later. The target of the curse must be decided at the moment of performing the ritual. It may be a specific creature with a given name, or a generic category like “zombie”.

      The effect of a “generic” curse is to reduce the target’s L by 1 for the duration of a whole encounter. A specific curse reduces the target’s L by 2 for the duration of a whole encounter.

      “Firing” the curse happens at will in combat and it does not require the expenditure of an action.

      Example: You cast the curse against zombies. The first time you meet zombies after performing the ritual, those zombies will be L2 instead of L3.

      Example 2: You perform the curse ritual against the Polka-Dot Maniac, a known Slasher. When you meet him, his L will be reduced by 2.

      You may have only one curse going on at any given time. You may decide not to fire it when you encounter the cursed creature and keep it for later. Once the curse has been used, you may perform the curse ritual again, using another candle and another dose of bone powder.
  - id: arcane_skill.demon_slayer
    name: Demon Slayer
    xp: 3
    text: >-
      You have +1 to saves and Defense rolls vs. any creature from the Demonic
      Horrors table.
    expert: the bonus becomes +2.
  - id: arcane_skill.energy_of_the_macrocosmos
    name: Energy of the Macrocosmos
    xp: 3
    components: incense
    sacrifice: 1 candle or 2 Food
    text: |-
      To learn this ritual, you must have the Occultist Skill at Basic or Expert level and read one of the following books:

      - Necronomicon
      - Occult Guide

      Performing the ritual takes 2 boxes of time. At the end of the ritual, you gain d6 Luck points. During the game, you may spend 1 Luck point to avoid 1 Damage or gain +1 on an Attack or Defense roll. You may not apply more than 1 Luck point at a time. You may perform this ritual only once per mission.
  - id: arcane_skill.exorcism
    name: Exorcism
    xp: 2
    components: |-
      1 of the following:
      - Holy water
      - Incense
      - Essential oils
    text: |-
      You may learn this Arcane Skill from one of the following books:

      - Holy Book
      - The Occult Guide
      - The Diabolical Deal

      You may expel a demon or spirit from a possessed item, locale, animal or person. Doing so requires a roll against the spirit’s L. Add +1 with the Will Skill, +2 with Will (Expert). If the roll succeeds, the creature must leave the area. If the roll fails, you may try again later, but you will not be able to defend against the demon’s next attack.
    expert: add +1 to your roll.
  - id: arcane_skill.foretell
    name: Foretell
    xp: 2
    components: Black mirror
    sacrifice: 1 candle
    text: |-
      To learn this ritual, you must read one of the following books:

      - Necronomicon
      - Occult Guide

      Once per mission, you may roll on the Town Exploration table BEFORE entering an area. You may change your mind and go somewhere else if you do not like the result.
  - id: arcane_skill.gate
    name: Gate
    xp: 2
    components: none
    text: |-
      To learn this Arcane Skill, you need to do one of the following:

      - Read the Necronomicon;
      - Read the Holy Book;
      - Read the Occult Guide and the Occultist Skill at Expert level;
      - Read the Diabolical Deal and lose 1 Sanity point (temporary loss);
      - Have the Occultist Skill (Basic or Expert) and spend 5 Clues in a box with a Hell Gate.

      Using this Arcane Skill, you close a Hell Gate. You must perform an L6 Will roll. Roll at +1 if you have Will, and +2 if you have Will (Expert). A failed attempt costs 1 Life and 1 Sanity as the energies of the hell gate course through you. You may try as many times as you want, until you run out of Life or Sanity points.
  - id: arcane_skill.healing
    name: Healing
    xp: 4
    components: Food, Holy Book
    sacrifice: 1 Food, 1 Candle
    text: >-
      Once per mission, you perform a ritual that heals up to 4 Life. You may
      learn this from the Holy Book.
  - id: arcane_skill.mutant_hunter
    name: Mutant Hunter
    xp: 2
    text: |-
      You may learn this Arcane Skill from a computer printout about mutants.

      You gain +1 to Attack and Defense rolls against any mutants.
    expert: the bonus becomes +2.
  - id: arcane_skill.pentagram
    name: Pentagram
    xp: 4
    components: art materials, ritual dagger
    sacrifice: 7 candles.
    text: |-
      To learn the Pentagram ritual, you must read one of the following books:

      - The Diabolical Deal
      - The Necronomicon
      - The Occult Guide

      After performing this ritual, you gain a +1 to Defense rolls against all demons until the end of the current mission. If you have a Pentagram cast upon yourself, you may not use the Summon Servitor Arcane Skill. You may however “break” the pentagram at any moment. You may then cast it again by sacrificing another 7 candles.
  - id: arcane_skill.summon_servitor
    name: Summon Servitor
    xp: 2
    components: bell, ritual dagger
    sacrifice: 5 candles or 2 Life points (your choice).
    text: |-
      To learn the Summon Servitor Arcane Skill, you must fulfill one of the following conditions:

      - Read the Necronomicon and lose 1 permanent point of Sanity;
      - Read the Occult Guide and have the Occultist Skill (Expert);
      - Read the Diabolical Deal and have the Occultist Skill (Basic or Expert).

      You spend 1 box of time preparing the ritual and casting it. Choose the L of the Servitor you want to summon. The more powerful the servitor, the more difficult to summon it and control it. Its L can be 2, 4, or 6. Then perform a Magic Roll against that L, adding +1 if you have Occultism and +2 with Occultism (Expert). On a failure, you lose 1 Sanity and the servitor does not appear. You can try again as many times you want, but each failed attempt will cost you 1 Sanity.

      If you succeed, you must now control the creature. Perform a Will roll at +1 if you have Will, +2 if you have Will (Expert) against the creature’s L. If you fail the roll, the creature will attack you! You must fight a creature with its L, as many Life points as its L and Damage 1. You may not escape from this fight.

      Once you control the Servitor, it will move with you. It can become invisible at will, so its presence will not affect your interactions with people or your Charisma rolls.

      You can use it to fight as if it were another character. It will have a bonus to Attack and Defense rolls equal to half its L, and a number of Life points equal to its L. The creature will always fight in your place until it reaches 0 Life and disappears. When you encounter multiple foes, you must split their attacks as equally as possible between yourself and the Servitor.

      You may attempt to summon another servitor, repeating the same procedure described above, only when the previous one dies. You may not have two servitors at the same time. You may at any moment dismiss a controlled Servitor. It will just disappear if you so wish.
